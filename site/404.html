<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · YourHome</title>
<meta name="color-scheme" content="light dark">
<!-- Styles are inlined: 404.html is served for URLs at any depth, so relative
     asset paths cannot be relied on here. -->
<style>
  :root { --bg:#f7f6f3; --surface:#fff; --border:#e2ded6; --text:#23201c; --muted:#6b645b; --accent:#b4532a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15130f; --surface:#1d1a16; --border:#322d26; --text:#f0ece5; --muted:#a89f93; --accent:#e08a5d; }
  }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
    background:var(--bg); color:var(--text);
    font:16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { padding:2rem 1.25rem; max-width:34rem; }
  .eyebrow { margin:0 0 .6rem; text-transform:uppercase; letter-spacing:.12em; font-size:.74rem; font-weight:600; color:var(--accent); }
  h1 { margin:0 0 1rem; font-size:clamp(1.9rem,5vw,2.8rem); line-height:1.15; letter-spacing:-.03em; }
  p.lede { margin:0; color:var(--muted); }
  a.btn { display:inline-block; margin-top:2rem; padding:.7rem 1.2rem; border-radius:999px; background:var(--accent); color:#fff; text-decoration:none; font-weight:550; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">404</p>
  <h1>That page isn't here.</h1>
  <p class="lede">The link may be out of date, or the page may have moved.</p>
  <a class="btn" id="home" href="/">Back to YourHome</a>
</main>
<script>
  // Project pages live under /<repo>/; user/org and custom-domain sites live at /.
  (function () {
    var seg = location.pathname.split('/').filter(Boolean)[0];
    var host = location.hostname;
    var isProjectPage = /\.github\.io$/.test(host) && seg;
    document.getElementById('home').href = isProjectPage ? '/' + seg + '/' : '/';
  })();
</script>
</body>
</html>
